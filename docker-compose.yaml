services:
  # 1. Mock de AWS (LocalStack Community - S3)
  localstack:
    image: localstack/localstack:3.0.0
    container_name: localstack_s3
    ports:
      - "${LOCALSTACK_HOST_PORT:-4566}:4566"
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - localstack_data:/var/lib/localstack

  # 2. Base de datos para Airflow y Data Warehouse
  postgres:
    image: postgres:15
    container_name: airflow_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-airflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-airflow}
      - POSTGRES_DB=${POSTGRES_DB:-airflow}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow} -d ${POSTGRES_DB:-airflow}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Apache Airflow (Custom Dockerfile con OpenJDK 17 + dbt + Spark Provider + Kafka Provider)
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: custom-airflow:2.9.0
    container_name: airflow_webserver
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started
      spark-master:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-airflow}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-http://localstack:4566}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-raw-data}
      - POSTGRES_USER=${POSTGRES_USER:-airflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-airflow}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-airflow}
      - DBT_SCHEMA=${DBT_SCHEMA:-analytics}
      - DBT_ALLOW_EXPERIMENTAL_ADAPTERS=${DBT_ALLOW_EXPERIMENTAL_ADAPTERS:-true}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    volumes:
      - ./dags:/opt/airflow/dags
      - ./dbt_project:/opt/airflow/dbt_project
      - ./spark_jobs:/opt/airflow/spark_jobs
      - ./streaming:/opt/airflow/streaming
    ports:
      - "${AIRFLOW_WEBSERVER_HOST_PORT:-8888}:8080"
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create --username ${AIRFLOW_ADMIN_USER:-admin} --password ${AIRFLOW_ADMIN_PASSWORD:-admin} --firstname ${AIRFLOW_ADMIN_FIRSTNAME:-Admin} --lastname ${AIRFLOW_ADMIN_LASTNAME:-Admin} --role ${AIRFLOW_ADMIN_ROLE:-Admin} --email ${AIRFLOW_ADMIN_EMAIL:-admin@example.com} || true &&
        python3 -c 'from airflow import settings; from airflow.models import Connection; import json, os; session = settings.Session(); conn_aws = Connection(conn_id=\"aws_default\", conn_type=\"aws\", extra=json.dumps({\"endpoint_url\": os.getenv(\"AWS_ENDPOINT_URL\", \"http://localstack:4566\"), \"aws_access_key_id\": os.getenv(\"AWS_ACCESS_KEY_ID\", \"test\"), \"aws_secret_access_key\": os.getenv(\"AWS_SECRET_ACCESS_KEY\", \"test\"), \"region_name\": os.getenv(\"AWS_DEFAULT_REGION\", \"us-east-1\")})); session.merge(conn_aws); conn_spark = Connection(conn_id=\"spark_default\", conn_type=\"spark\", host=\"spark://spark-master\", port=7077); session.merge(conn_spark); session.commit()' || true &&
        airflow webserver &
        airflow scheduler
      "

  # 4. Apache Spark Cluster - Master
  spark-master:
    image: apache/spark:3.5.1
    container_name: spark_master
    environment:
      - SPARK_MODE=master
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-http://localstack:4566}
      - AWS_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    ports:
      - "${SPARK_MASTER_PORT:-7077}:7077"
      - "${SPARK_UI_PORT:-8081}:8080"
    volumes:
      - ./spark_jobs:/opt/spark/jobs
    command: "/opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --ip 0.0.0.0 --port 7077 --webui-port 8080"

  # 5. Apache Spark Cluster - Worker
  spark-worker:
    image: apache/spark:3.5.1
    container_name: spark_worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY:-2G}
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES:-2}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-http://localstack:4566}
      - AWS_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ./spark_jobs:/opt/spark/jobs
    command: "/opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077"

  # 6. Apache Kafka (KRaft Mode - Sin Zookeeper)
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka_broker
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"
      - "${KAFKA_BROKER_PORT:-9092}:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-29092}
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=1

  # 7. Kafka UI (Consola Web para inspeccionar tópicos y mensajes)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    depends_on:
      - kafka
    ports:
      - "${KAFKA_UI_HOST_PORT:-8082}:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092

volumes:
  localstack_data:
  postgres_data:
