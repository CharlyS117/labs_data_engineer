services:
  # 1. Mock de AWS (LocalStack Community - S3)
  localstack:
    image: localstack/localstack:3.0.0
    container_name: localstack_s3
    ports:
      - "${LOCALSTACK_HOST_PORT:-4566}:4566"
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - localstack_data:/var/lib/localstack

  # 2. Base de datos para Airflow y Data Warehouse
  postgres:
    image: postgres:15
    container_name: airflow_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-airflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-airflow}
      - POSTGRES_DB=${POSTGRES_DB:-airflow}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow} -d ${POSTGRES_DB:-airflow}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Apache Airflow (Webserver + Scheduler)
  airflow-webserver:
    image: apache/airflow:2.9.0-python3.11
    container_name: airflow_webserver
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-airflow}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-http://localstack:4566}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-raw-data}
      - POSTGRES_USER=${POSTGRES_USER:-airflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-airflow}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-airflow}
      - DBT_SCHEMA=${DBT_SCHEMA:-analytics}
      - DBT_ALLOW_EXPERIMENTAL_ADAPTERS=${DBT_ALLOW_EXPERIMENTAL_ADAPTERS:-true}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./dbt_project:/opt/airflow/dbt_project
    ports:
      - "${AIRFLOW_WEBSERVER_HOST_PORT:-8888}:8080"
    command: >
      bash -c "
        pip install --no-cache-dir dbt-postgres==1.8.2 &&
        airflow db migrate &&
        airflow users create --username ${AIRFLOW_ADMIN_USER:-admin} --password ${AIRFLOW_ADMIN_PASSWORD:-admin} --firstname ${AIRFLOW_ADMIN_FIRSTNAME:-Admin} --lastname ${AIRFLOW_ADMIN_LASTNAME:-Admin} --role ${AIRFLOW_ADMIN_ROLE:-Admin} --email ${AIRFLOW_ADMIN_EMAIL:-admin@example.com} || true &&
        python3 -c 'from airflow import settings; from airflow.models import Connection; import json, os; conn = Connection(conn_id=\"aws_default\", conn_type=\"aws\", extra=json.dumps({\"endpoint_url\": os.getenv(\"AWS_ENDPOINT_URL\", \"http://localstack:4566\"), \"aws_access_key_id\": os.getenv(\"AWS_ACCESS_KEY_ID\", \"test\"), \"aws_secret_access_key\": os.getenv(\"AWS_SECRET_ACCESS_KEY\", \"test\"), \"region_name\": os.getenv(\"AWS_DEFAULT_REGION\", \"us-east-1\")})); s = settings.Session(); s.merge(conn); s.commit()' || true &&
        airflow webserver &
        airflow scheduler
      "

volumes:
  localstack_data:
  postgres_data:
